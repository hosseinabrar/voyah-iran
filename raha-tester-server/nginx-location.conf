# Add ONLY these locations inside the existing HTTPS server for voyah-iran.ir.
# Do not replace the subscription server configuration. TLS is required for microphone access.
location = /raha-train { return 308 /raha-train/; }
location /raha-train/ {
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:18767;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 100s;
    proxy_buffering off;
}
