server {
    listen 80;
    server_name raha.voyah-iran.ir;
    location /.well-known/acme-challenge/ { root /var/www/raha-acme; }
    location / { return 301 https://raha.voyah-iran.ir$request_uri; }
}
server {
    listen 443 ssl;
    server_name raha.voyah-iran.ir;
    ssl_certificate /etc/letsencrypt/live/raha.voyah-iran.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raha.voyah-iran.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;
    location = / { return 302 /raha-train/; }
    location = /raha-train { return 308 /raha-train/; }
    location /raha-train/ {
        proxy_pass http://127.0.0.1:18767;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 100s;
        proxy_buffering off;
    }
    location / { return 404; }
}
