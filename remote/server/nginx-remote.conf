# Dedicated subdomain only. Never redirect or change voyah-iran.ir HTTP.
limit_req_zone $binary_remote_addr zone=voyah_remote_rate:1m rate=10r/s;
server {
    listen 80;
    server_name remote.voyah-iran.ir;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://remote.voyah-iran.ir$request_uri; }
}
server {
    listen 443 ssl;
    server_name remote.voyah-iran.ir;
    ssl_certificate /etc/letsencrypt/live/remote.voyah-iran.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remote.voyah-iran.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    access_log /var/log/nginx/voyah-remote.access.log;
    error_log /var/log/nginx/voyah-remote.error.log;
    root /opt/voyah-remote/vi-remote;
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Permissions-Policy "camera=(self), microphone=()";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.neshan.org; style-src 'self' 'unsafe-inline' https://static.neshan.org; img-src 'self' data: blob: https://*.neshan.org; connect-src 'self' https://*.neshan.org; media-src 'self' blob:; frame-ancestors 'none'";
    }
    location = /healthz { proxy_pass http://127.0.0.1:18780; }
    location /v1/ { proxy_pass http://127.0.0.1:18780; proxy_read_timeout 15s; }
    location /v2/stream/ {
        limit_req zone=voyah_remote_rate burst=20 nodelay;
        proxy_pass http://127.0.0.1:18780;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 25s;
        proxy_send_timeout 5s;
        proxy_buffering off;
    }
    location /v2/ {
        limit_req zone=voyah_remote_rate burst=20 nodelay;
        proxy_pass http://127.0.0.1:18780;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
        proxy_send_timeout 5s;
    }
}
