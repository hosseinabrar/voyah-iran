<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://static.neshan.org/sdk/leaflet/v1.9.4/neshan-sdk/v1.0.8/index.css">
<style>html,body,#map{margin:0;width:100%;height:100%;background:#151f2d}#notice{position:absolute;top:8px;left:45px;right:8px;z-index:1000;background:#fff;color:#111;padding:8px;border-radius:8px;font:14px sans-serif;pointer-events:none}</style>
</head><body><div id="map"></div><div id="notice">در حال بارگذاری نقشه…</div>
<script>
var map=null, marker=null, selection=null, config=__CONFIG__;
function notice(text){document.getElementById('notice').textContent=text;}
function choose(lat,lon){
 if(!isFinite(lat)||!isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return;
 selection={latitude:lat,longitude:lon};
 if(marker){marker.setLatLng([lat,lon]);} else
 marker=L.circleMarker([lat,lon],{radius:10,color:'#ffffff',weight:3,fillColor:'#007e73',fillOpacity:1}).addTo(map);
 notice('موقعیت انتخاب شد؛ برای تغییر، نقشه را بکشید یا نقطهٔ دیگری را لمس کنید.');
}
window.showPoint=function(lat,lon){if(!map)return false;map.setView([lat,lon],17);choose(lat,lon);return true;};
function start(){try{
 map=new L.Map('map',{key:config.key,maptype:'dreamy',center:[config.latitude,config.longitude],zoom:14});
 map.on('click',function(e){choose(e.latlng.lat,e.latlng.lng);});
 map.on('drag',function(){var p=map.getCenter();choose(p.lat,p.lng);});
 map.on('dragend',function(){var p=map.getCenter();choose(p.lat,p.lng);});
 map.eachLayer(function(layer){if(layer.on)layer.on('tileerror',function(){notice('نقشه بارگذاری نشد؛ اتصال اینترنت را بررسی و دوباره تلاش کنید.');});});
 notice('نقشه را جابه‌جا کنید و محل مورد نظر را لمس کنید.');
 if(config.selected)choose(config.latitude,config.longitude);
}catch(e){notice('نقشه بارگذاری نشد؛ دوباره تلاش کنید.');}}
var sdk=document.createElement('script');sdk.src='https://static.neshan.org/sdk/leaflet/v1.9.4/neshan-sdk/v1.0.8/index.js';sdk.onload=start;sdk.onerror=function(){notice('نقشه بارگذاری نشد؛ اتصال اینترنت را بررسی کنید.');};document.head.appendChild(sdk);
</script></body></html>
